<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Greek</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; }
    .live {
      position: absolute;
      top: 20px;
      left: 16px;
      background: #0f3d0f;
      color: #4ade80;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .logo { width: 64px; height: 64px; margin: 24px auto 12px; display: block; border-radius: 14px; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    .explanation {
      color: #888;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      color: #fff;
    }
    .tab.active { border-color: #3b82f6; }
    .tab-label { font-size: 18px; font-weight: 700; }
    .tab-24h .tab-label { color: #4ade80; }
    .tab-7d .tab-label { color: #60a5fa; }
    .tab-sub { font-size: 11px; color: #888; margin-top: 2px; }
    .token {
      background: #111;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      border: 1px solid #222;
    }
    .token-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .rank { color: #3b82f6; font-weight: 700; font-size: 15px; }
    .score { background: #1a1a1a; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .name { font-weight: 600; font-size: 15px; }
    .chain { font-size: 11px; color: #888; text-transform: uppercase; }
    .stats { font-size: 12px; color: #aaa; margin-top: 6px; }
    .stats span { margin-right: 12px; }
    a { color: #3b82f6; text-decoration: none; font-size: 12px; }
    .hidden { display: none; }
    .updated { text-align: center; color: #666; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="live">LIVE DATA</div>
    <header>
      <img src="icon.png" alt="Logo" class="logo">
      <h1>CRYPTO GREEK</h1>
      <div class="explanation">
        Ranked by trading volume and liquidity.<br>
        Higher score means stronger recent activity relative to available liquidity.
      </div>
    </header>

    <div class="tabs">
      <div class="tab tab-24h active" onclick="showTab('24h')">
        <div class="tab-label">24H</div>
        <div class="tab-sub">New launches</div>
      </div>
      <div class="tab tab-7d" onclick="showTab('7d')">
        <div class="tab-label">7D</div>
        <div class="tab-sub">New launches</div>
      </div>
    </div>

    <div id="list24h"></div>
    <div id="list7d" class="hidden"></div>

    <div class="updated" id="updated"></div>
  </div>

  <script>
    let currentData = null;

    async function load() {
      try {
        const res = await fetch('tokens.json?t=' + Date.now());
        currentData = await res.json();
        document.getElementById('updated').textContent = "Updated " + currentData.updated_at;
        render();
      } catch (e) {
        document.getElementById('list24h').innerHTML = "<p>Error loading data</p>";
      }
    }

    function render() {
      if (!currentData) return;
      const tokens = currentData.tokens || [];

      const html = tokens.map((t, i) => `
        <div class="token">
          <div class="token-header">
            <div class="rank">#${i + 1}</div>
            <div class="score">${t.score}</div>
          </div>
          <div class="name">${t.name}</div>
          <div class="chain">${t.chain}</div>
          <div class="stats">
            <span>Vol $${Number(t.volume_24h).toLocaleString()}</span>
            <span>Liq $${Number(t.liquidity).toLocaleString()}</span>
          </div>
          <a href="${t.link}" target="_blank">View on DexScreener →</a>
        </div>
      `).join('');

      document.getElementById('list24h').innerHTML = html;
      document.getElementById('list7d').innerHTML = html;
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab-' + tab).classList.add('active');
      document.getElementById('list24h').classList.toggle('hidden', tab !== '24h');
      document.getElementById('list7d').classList.toggle('hidden', tab !== '7d');
    }

    load();
  </script>
</body>
</html>
