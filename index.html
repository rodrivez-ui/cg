<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Greek</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .live {
      background: #0f3d0f;
      color: #4ade80;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      background: #1a1a1a;
      border: none;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: left;
      cursor: pointer;
      color: #fff;
    }
    .tab.active-24h { background: #1a1a1a; }
    .tab.active-7d { background: #1a1a1a; }
    .tab-label {
      font-size: 20px;
      font-weight: 700;
    }
    .tab-24h .tab-label { color: #4ade80; }
    .tab-7d .tab-label { color: #60a5fa; }
    .tab-sub {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
      padding: 0 4px 8px;
      border-bottom: 1px solid #222;
    }
    .token {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #1a1a1a;
    }
    .rank { width: 40px; color: #888; font-weight: 500; }
    .name { flex: 1; font-weight: 500; }
    .score { font-weight: 600; color: #fff; }
    .hidden { display: none; }
    .updated {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CRYPTO GREEK</h1>
      <div class="live">LIVE DATA</div>
    </header>

    <div class="tabs">
      <button class="tab tab-24h" onclick="showTab('24h')">
        <div class="tab-label">24H</div>
        <div class="tab-sub">New launches</div>
      </button>
      <button class="tab tab-7d" onclick="showTab('7d')">
        <div class="tab-label">7D</div>
        <div class="tab-sub">New launches</div>
      </button>
    </div>

    <div class="section-title">Top-ranked new coins</div>

    <div class="table-header">
      <span>Rank</span>
      <span>Coin</span>
      <span>Score</span>
    </div>

    <div id="list24h"></div>
    <div id="list7d" class="hidden"></div>

    <div class="updated" id="updated"></div>
  </div>

  <script>
    let currentData = null;

    async function load() {
      try {
        const res = await fetch('tokens.json?t=' + Date.now());
        currentData = await res.json();
        document.getElementById('updated').textContent = "Updated " + currentData.updated_at;
        render();
      } catch (e) {
        document.getElementById('list24h').innerHTML = "<p>Error loading data</p>";
      }
    }

    function render() {
      if (!currentData) return;
      const tokens = currentData.tokens || [];

      const html = tokens.map((t, i) => `
        <div class="token">
          <div class="rank">${i + 1}</div>
          <div class="name">${t.name}</div>
          <div class="score">${t.score}</div>
        </div>
      `).join('');

      document.getElementById('list24h').innerHTML = html;
      document.getElementById('list7d').innerHTML = html;
    }

    function showTab(tab) {
      document.getElementById('list24h').classList.toggle('hidden', tab !== '24h');
      document.getElementById('list7d').classList.toggle('hidden', tab !== '7d');
    }

    load();
  </script>
</body>
</html>
